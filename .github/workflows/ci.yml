name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            viewer/package-lock.json
            editor/package-lock.json

      - name: Install
        run: npm ci && npm ci --prefix viewer && npm ci --prefix editor

      - name: Unit tests
        run: npm test

      # Fetches the manuscripta manifests each exhibition uses, checks the
      # exhibitions and fails on errors (missing images, broken tour steps …).
      - name: Check exhibitions
        run: node scripts/prepare-exhibitions.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    # Public URL and path of the site. Set these as repository variables;
    # the defaults publish the viewer at /exhibition/ and the editor at /exhibition/editor/.
    env:
      EXHIBITION_BASE_URL: ${{ vars.EXHIBITION_BASE_URL || 'https://www.manuscripta.se/exhibition' }}
      SITE_PATH: ${{ vars.EXHIBITION_SITE_PATH || '/exhibition/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            viewer/package-lock.json
            editor/package-lock.json
      - run: npm ci && npm ci --prefix viewer && npm ci --prefix editor
      - name: Build
        run: |
          node scripts/prepare-exhibitions.mjs
          VITE_BASE="$SITE_PATH" npm run build --prefix viewer
          VITE_BASE="${SITE_PATH}editor/" npm run build --prefix editor
          mkdir -p site && cp -r viewer/dist/. site/ && mkdir -p site/editor && cp -r editor/dist/. site/editor/
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
