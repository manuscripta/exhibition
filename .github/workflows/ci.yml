name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            viewer/package-lock.json
            editor/package-lock.json

      - name: Install
        run: npm ci && npm ci --prefix viewer && npm ci --prefix editor

      - name: Unit tests
        run: npm test

      # Fetches the manuscripta manifests each exhibition uses, checks the
      # exhibitions and fails on errors (missing images, broken tour steps …).
      - name: Check exhibitions
        run: node scripts/prepare-exhibitions.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    # Public URL and path of the site. The defaults are the GitHub Pages
    # address; override them with the repository variables EXHIBITION_BASE_URL
    # and EXHIBITION_SITE_PATH. The base URL becomes part of every published
    # IIIF id, so change it only when the site moves.
    env:
      EXHIBITION_BASE_URL: ${{ vars.EXHIBITION_BASE_URL || 'https://manuscripta.github.io/exhibition' }}
      SITE_PATH: ${{ vars.EXHIBITION_SITE_PATH || '/exhibition/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            viewer/package-lock.json
            editor/package-lock.json
      - run: npm ci && npm ci --prefix viewer && npm ci --prefix editor
      - name: Build
        run: |
          node scripts/prepare-exhibitions.mjs
          VITE_BASE="$SITE_PATH" npm run build --prefix viewer
          VITE_BASE="${SITE_PATH}editor/" npm run build --prefix editor
          mkdir -p site && cp -r viewer/dist/. site/ && mkdir -p site/editor && cp -r editor/dist/. site/editor/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # Publishes the site on GitHub Pages for every push to main.
  # Requires Settings → Pages → Source: "GitHub Actions".
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
